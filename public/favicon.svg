<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Square background matching the navbar badge -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="4" fill="#0F1115" stroke="#222" stroke-width="1" />
  
  <!-- Subtle inner border -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="3" fill="none" stroke="#333" stroke-width="0.75" opacity="0.6" />
  
  <!-- "AS" initials text -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="13" 
    font-weight="800" 
    letter-spacing="1.5px"
  >
    AS
  </text>
</svg>
